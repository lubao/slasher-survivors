services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"
    ports:
      - "8001:8000"

  api:
    build: .
    depends_on:
      - dynamodb-local
    environment:
      GAME_TABLE: slasher-survivors
      AWS_REGION: us-west-1
      DDB_ENDPOINT: http://dynamodb-local:8000
      # DynamoDB Local ignores these but boto3 requires credentials to be set.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "8000:8000"
